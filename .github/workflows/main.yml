
name: Compilador SLILMA RADIO APK

on:
  workflow_dispatch:
  push:
    branches: [ "principal" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: ""
          accept-android-sdk-licenses: "true"

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

     
      - name: Corregir carpeta de aplicación
        run: |
          mv aplicación app
          test -f app/build.gradle.kts


      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SLILMA_RADIO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
