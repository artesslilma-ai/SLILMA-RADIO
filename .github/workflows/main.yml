
name: Compilador SLILMA RADIO APK

on:
  workflow_dispatch:
  push:
    branches: [ "principal" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: ""
          accept-android-sdk-licenses: "true"

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

     
      
      - name: Configurar módulo Android
        shell: bash
        run: |
          echo "Contenido del repositorio:"
          ls -la
          APP_DIR=$(find . -maxdepth 3 -type f -name build.gradle.kts | grep -v '^\./build.gradle.kts$' | head -n 1 | xargs dirname)
          echo "Módulo encontrado: $APP_DIR"
          if [ -z "$APP_DIR" ]; then
            echo "No se encontró el módulo Android"
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          printf '\nproject(":app").projectDir = file("%s")\n' "$APP_DIR" >> settings.gradle.kts

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SLILMA_RADIO-APK
          path: ${{ env.APP_DIR }}/build/outputs/apk/debug/app-debug.apk

