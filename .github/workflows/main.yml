
name: Compilar SLILMA RADIO APK

on:
  workflow_dispatch:
  push:
    branches: [ "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar carpeta de aplicación
        run: |
          sed -i '/include(":app")/a project(":app").projectDir = file("aplicación")' settings.gradle.kts

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: SLILMA_RADIO-APK
          path: aplicación/build/outputs/apk/debug/app-debug.apk
